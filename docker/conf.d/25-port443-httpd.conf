# ************************************
# Port :443 httpd config
# ************************************
# 
<VirtualHost *:8443>

  ## Vhost docroot
  DocumentRoot "/var/www/html"

  ## Directories, there should at least be a declaration for /var/www/html
  <Directory "/var/www/html">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride None
    Require all granted
  </Directory>

  ## Logging
  ErrorLog "/data/bigmon/logs/port443_error.log"
  ServerSignature Off
  # remove userid header from response, but log it
  Header note X-BP-User-Id bpuser
  Header unset X-BP-User-Id
  Header always unset X-BP-User-Id
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" uid=%{bpuser}n" combined_bpuser
  CustomLog "/data/bigmon/logs/port443_access.log" combined_bpuser

  ## SSL directives
  SSLEngine on
  SSLCertificateFile      "/etc/grid-security/hostcert.pem"
  SSLCertificateKeyFile   "/etc/grid-security/hostkey.pem"
  SSLCertificateChainFile "/etc/grid-security/chain.pem"

  ProxyPreserveHost On
  ProxyRequests Off

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} =websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule /(.*) ws://127.0.0.1:8000/$1 [P,L]

  ProxyPassMatch ^/(ws(/.*)?)$ ws://127.0.0.1:8000/$1

  KeepAlive off

</VirtualHost>
